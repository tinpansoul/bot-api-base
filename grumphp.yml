grumphp:
    process_timeout: 600
    ascii:
        succeeded: ~
    tasks:
        phpcs:
            standard: []
            severity: ~
            error_severity: ~
            warning_severity: 0
            tab_width: ~
            report: full
            report_width: ~
            whitelist_patterns: []
            encoding: ~
            ignore_patterns: []
            sniffs: []
            triggered_by: [php]
        phpcsfixer:
            allow_risky: true
            config: .php-cs-fixer.dist.php
            using_cache: true
            verbose: true
            diff: false
            triggered_by: ['php']
        phpstan:
            configuration: phpstan.neon
            memory_limit: "-1"
            use_grumphp_paths: false
            triggered_by: ['php']
        composer:
            file: ./composer.json
            no_check_all: false
            no_check_lock: false
            no_check_publish: false
            with_dependencies: false
            strict: false
#        phpcpd:
#            directory: ['.']
#            exclude: ['vendor']
#            fuzzy: false
#            min_lines: 5
#            min_tokens: 70
#            triggered_by: ['php']
        phpmnd:
            directory: '.'
            whitelist_patterns: []
            exclude: []
            exclude_name: []
            exclude_path: ['vendor']
            extensions: []
            hint: false
            ignore_numbers: []
            ignore_strings: []
            strings: false
            triggered_by: ['php']
        phpunit:
            config_file: phpunit-grum.xml.dist
            testsuite: ~
            group: []
            always_execute: false
        git_commit_message:
            allow_empty_message: false
            enforce_capitalized_subject: false
            enforce_no_subject_trailing_period: true
            enforce_single_lined_subject: true
            max_subject_width: 72
            max_body_width: 100
            case_insensitive: false
            multiline: false
            matchers:
                'Subject must follow Conventional Commits, e.g. "fix(client): encode arrays as JSON"':
                    '/^(?:(?:fixup|squash)! )?(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._\/-]+\))?!?: .+/'
        git_blacklist:
            keywords:
            - "die()"
            - "die;"
            - "var_dump"
            - "dump"
            - "exit;"
            triggered_by: [php]
